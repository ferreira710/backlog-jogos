# Override com hot reload, para desenvolver dentro dos containers:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    # O uv instala o projeto em site-packages; sem PYTHONPATH o --reload poderia
    # importar a copia instalada em vez do codigo montado do host.
    environment:
      PYTHONPATH: /app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      # Volume anonimo: preserva o node_modules do container e nao deixa o
      # da maquina host (build de outra arquitetura) sobrescrever.
      - /app/node_modules
    ports:
      - "5173:5173"
