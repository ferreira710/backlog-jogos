server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: qualquer rota desconhecida devolve o index, senao um F5 em
    # /qualquer-coisa daria 404 do nginx em vez de abrir o app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets tem hash no nome; podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
